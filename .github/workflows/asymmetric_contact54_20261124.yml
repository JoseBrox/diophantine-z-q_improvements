name: Verify asymmetric contact defining quartic
on:
  push:
    paths:
      - 'computation/asymmetric_contact54_20261124/**'
      - '.github/workflows/asymmetric_contact54_20261124.yml'
  workflow_dispatch:
jobs:
  exact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B computation/asymmetric_contact54_20261124/verify.py
