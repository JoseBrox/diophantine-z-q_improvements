name: Artifact integrity
on:
  push:
  pull_request:
jobs:
  source-archive-sha256:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_archive_integrity.py
      - run: python3 scripts/report_benchmarks.py
