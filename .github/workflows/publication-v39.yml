name: Publish verified 196, 258 and 78 variable constructions
on:
  push:
    branches: [main]
    paths: [publication/v39/**, .github/workflows/publication-v39.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - name: Authenticate sources and independently reconstruct all new tables
        run: python -B publication/v39/bootstrap.py prepare
      - name: Run all eight suites and 126 legacy stages on native Python 3.12
        run: python -B scripts/verify_all_v38.py --output /tmp/v39-verification
      - name: Bind successful native verification and publication bytes
        run: python -B publication/v39/bootstrap.py finalize --report /tmp/v39-verification/verification.json
      - name: Commit verified results directly to main
        run: |
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git add -f sources/h10_quartic198/circuits/elimination-search.log
          git commit -m 'Publish verified 196 and 258 variable quartics, recovered abc78 and cumulative research'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/publication-commit.txt
          git archive --format=tar HEAD | gzip -n > /tmp/publication-v39-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-v39
          path: |
            /tmp/publication-commit.txt
            /tmp/publication-v39-source.tar.gz
            /tmp/v39-verification/
          retention-days: 14
