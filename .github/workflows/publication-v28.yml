name: Publish verified v28 general degree improvements
on:
  push:
    branches: [main]
    paths: [publication/v28/**, .github/workflows/publication-v28.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication-v28
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - name: Authenticate sources and reconstruct every new specification
        run: |
          python -B publication/v28/install.py install
          python -B computation/few_variables/unit_norm_v28/build.py
          python -B computation/few_variables/unit_norm_v28/check.py
          python -B publication/v28/install.py expected
          python -B scripts/update_manifest.py
      - name: Independently reconstruct v28 specifications
        run: python -B scripts/verify_v28.py --report /tmp/v28.json
      - name: Reproduce retained cumulative results in isolation
        run: python -B scripts/verify_release_v27.py --report /tmp/retained-v27.json
      - name: Verify all 126 legacy stages on native Python 3.12
        run: python -B scripts/verify.py --full --receipt /tmp/legacy.json
      - name: Bind verification records and check the publication bytes
        run: |
          python -B publication/v28/install.py record
          python -B scripts/verify_v28.py --report /tmp/final-v28.json
          git diff --exit-code "$GITHUB_SHA" -- .github/workflows
      - name: Commit verified results directly to main
        run: |
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish v28: single norm determinant, reduced 25/13-variable degrees, explicit27 coefficient bound'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/publication-commit.txt
          git archive --format=tar HEAD | gzip -n > /tmp/publication-v28-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-v28
          path: |
            /tmp/publication-commit.txt
            /tmp/publication-v28-source.tar.gz
            /tmp/v28.json
            /tmp/retained-v27.json
            /tmp/legacy.json
            /tmp/final-v28.json
          retention-days: 7
