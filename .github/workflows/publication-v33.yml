name: Publish corrected 200-variable quartic and cumulative degree improvements
on:
  push:
    branches: [main]
    paths: [publication/v33/**, .github/workflows/publication-v33.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - name: Authenticate sources and reconstruct all new tables
        run: python -B publication/v33/bootstrap.py prepare
      - name: Verify corrected scalar normalization and every quartic coefficient
        run: python -B scripts/verify_v33.py --report /tmp/v33.json
      - name: Verify v30 general degrees and compatible-pole applications
        run: python -B scripts/verify_v30.py --report /tmp/v30.json
      - name: Verify v29 joint pole identities
        run: python -B computation/pole_parameters/joint_realization_v29/check.py
      - name: Reconstruct retained v28 specifications
        run: python -B scripts/verify_v28.py --report /tmp/v28.json
      - name: Reconstruct cumulative v27 release in isolation
        run: python -B scripts/verify_release_v27.py --report /tmp/v27.json
      - name: Run all 126 legacy stages on native Python 3.12
        run: python -B scripts/verify.py --full --receipt /tmp/legacy.json
      - name: Bind all passing checks and authenticate publication bytes
        run: python -B publication/v33/bootstrap.py finalize --v33 /tmp/v33.json --v30 /tmp/v30.json --v28 /tmp/v28.json --v27 /tmp/v27.json --legacy /tmp/legacy.json
      - name: Commit verified results directly to main
        run: |
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish corrected 200-variable quartic, v30 degree improvements, and exact arithmetic supplements'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/publication-commit.txt
          git archive --format=tar HEAD | gzip -n > /tmp/publication-v33-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-v33
          path: |
            /tmp/publication-commit.txt
            /tmp/publication-v33-source.tar.gz
            /tmp/v33.json
            /tmp/v30.json
            /tmp/v28.json
            /tmp/v27.json
            /tmp/legacy.json
          retention-days: 14
