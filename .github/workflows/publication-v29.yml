name: Publish verified v29 pole realization results
on:
  push:
    branches: [main]
    paths: [publication/v29/**, .github/workflows/publication-v29.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0
      - name: Authenticate sources and reconstruct the new exact certificate
        run: python -B publication/v29/bootstrap.py prepare
      - name: Independently check the v29 pole identities and examples
        run: python -B computation/pole_parameters/joint_realization_v29/check.py
      - name: Reconstruct the v28 general degree specifications
        run: python -B scripts/verify_v28.py --report /tmp/v28.json
      - name: Reproduce retained cumulative results in isolation
        run: python -B scripts/verify_release_v27.py --report /tmp/v27.json
      - name: Verify all 126 legacy stages on native Python 3.12
        run: python -B scripts/verify.py --full --receipt /tmp/legacy.json
      - name: Bind successful checks and verify all publication bytes
        run: python -B publication/v29/bootstrap.py finalize --v28 /tmp/v28.json --v27 /tmp/v27.json --legacy /tmp/legacy.json
      - name: Commit verified results directly to main
        run: |
          test "$(git branch --show-current)" = main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git diff --exit-code -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish v29 joint pole realization and progression-density proofs with exact certificates'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/publication-commit.txt
          git archive --format=tar HEAD | gzip -n > /tmp/publication-v29-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-v29
          path: |
            /tmp/publication-commit.txt
            /tmp/publication-v29-source.tar.gz
            /tmp/v28.json
            /tmp/v27.json
            /tmp/legacy.json
          retention-days: 7
