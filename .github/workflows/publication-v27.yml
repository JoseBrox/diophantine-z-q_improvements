name: Publication v27 verification
on:
  push:
    branches: [research/2026-11-14-integration-v27]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact checked-out source
        run: |
          git rev-parse HEAD > /tmp/source-commit.txt
          git archive --format=tar HEAD | gzip -n > /tmp/own-repository-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: own-repository-source-v27
          path: |
            /tmp/own-repository-source.tar.gz
            /tmp/source-commit.txt
          retention-days: 7
