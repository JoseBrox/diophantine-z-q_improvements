name: Verify exact constructions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source semantics, polynomial tables, and exact bounds
        run: python3 scripts/verify.py --full
