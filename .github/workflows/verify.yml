name: Verify exact constructions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  exact-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.14.0 passagemath-pari==10.8.14
      - name: Verify bounded-variable undecidability transfers and source qualifications
        run: python -B scripts/verify_v89.py --report /tmp/v89-verification.json
      - name: Verify Bhargava-Burungale v2 transfers, all five degree ledgers and scoped obstructions
        run: python -B scripts/verify_v88.py --report /tmp/v88-verification.json
      - name: Verify compact v87 Busy Beaver index and coefficient bound
        run: python -B scripts/verify_v87.py --report /tmp/v87-verification.json
      - name: Verify explicit v86 Busy Beaver record and state bounds
        run: python -B scripts/verify_v86.py --report /tmp/v86-verification.json
      - name: Verify the conditional BB cutoff and explicit-constant gap
        run: python -B scripts/verify_v85.py --report /tmp/v85-verification.json
      - name: Verify Busy Beaver coefficient profiles and expanded TXT file sizes
        run: python -B scripts/verify_v84.py --report /tmp/v84-verification.json
      - name: Verify exact scalar squares and the actual-trace research limitations
        run: python -B scripts/verify_v83.py --report /tmp/v83-verification.json
      - name: Verify the 163 and 179 quartics, elliptic divisibility and actual-realization criterion
        run: python -B scripts/verify_v82.py --report /tmp/v82-verification.json
      - name: Verify the 56-variable quartic and amplified number-field descent
        run: python -B scripts/verify_v81.py --report /tmp/v81-verification.json
      - name: Verify the 58-variable quartic and the published-theorem pole transfer
        run: python -B scripts/verify_v80.py --report /tmp/v80-verification.json
      - name: Verify the 59-variable quartic, physical maps and scoped parity certificate
        run: python -B scripts/verify_v79.py --report /tmp/v79-verification.json
      - name: Verify Gabe Conant notes with Astra 6.2 and the strengthened v78 constructions
        run: python -B scripts/verify_v78.py --report /tmp/v78-verification.json
      - name: Verify uniform complement guards and the reference normalizer
        run: python -B scripts/verify_v77.py --report /tmp/v77-verification.json
      - name: Verify actual pole obstructions and the realization checkpoint
        run: python -B scripts/verify_v76.py --report /tmp/v76-verification.json
      - name: Verify even-valuation improvements, seven contacts and exact physical lifting
        run: python -B scripts/verify_v75.py --report /tmp/v75-verification.json
      - name: Verify the reconstructed 193-coordinate quartic and improved exact heights
        run: python -B scripts/verify_v74.py --report /tmp/v74-verification.json
      - name: Verify the complete 194-coordinate quartic and synchronized arithmetic
        run: python -B scripts/verify_v73.py --report /tmp/v73-verification.json
      - name: Verify full auxiliary points in the general twenty-five-variable construction
        run: python -B scripts/verify_v72.py --report /tmp/v72-verification.json
      - name: Verify full auxiliary elliptic points and the eleven-variable degree bound
        run: python -B scripts/verify_v71.py --report /tmp/v71-verification.json
      - name: Verify actual-trace arithmetic and quadratic obstructions
        run: python -B scripts/verify_v70.py --report /tmp/v70-verification.json
      - name: Verify power shifts, actual-trace obstructions and the Sun audit
        run: python -B scripts/verify_v69.py --report /tmp/v69-verification.json
      - name: Verify the compact explicit 229-variable quartic
        run: python -B scripts/verify_v68.py --report /tmp/v68-verification.json
      - name: Verify physical detector coordinates and exact scaling obstructions
        run: python -B scripts/verify_v67.py --report /tmp/v67-verification.json
      - name: Verify local factors and point-role obstructions
        run: python -B scripts/verify_v66.py --report /tmp/v66-verification.json
      - name: Verify the complete 68-variable quartic and derivative-fiber genus
        run: python -B scripts/verify_v65.py --report /tmp/v65-verification.json
      - name: Verify the actual-trace transfer and cofinite obstruction
        run: python -B scripts/verify_v64.py --report /tmp/v64-verification.json
      - name: Verify the derivative degree bound and number-field height tools
        run: python -B scripts/verify_v63.py --report /tmp/v63-verification.json
      - name: Verify the explicit 229-variable quartic and coupling obstruction
        run: python -B scripts/verify_v62.py --report /tmp/v62-verification.json
      - name: Verify rational pole levels and input-only false witnesses
        run: python -B scripts/verify_v61.py --report /tmp/v61-verification.json
      - name: Verify index divisibility and quotient-height obstructions
        run: python -B scripts/verify_v60.py --report /tmp/v60-verification.json
      - name: Verify the complete eleven-variable abc source and fixed-slope incidence theorem
        run: python -B scripts/verify_v59.py --report /tmp/v59-verification.json
      - name: Verify signed heights, small trace classes and actual-surface obstructions
        run: python -B scripts/verify_v58.py --report /tmp/v58-verification.json
      - name: Verify intrinsic transfers, variable classes and exact prepared descent obstruction
        run: python -B scripts/verify_v57.py --report /tmp/v57-verification.json
      - name: Verify single-cover criteria, intrinsic poles, precision transfer and inert obstruction
        run: python -B scripts/verify_v56.py --report /tmp/v56-verification.json
      - name: Verify reweighted sources, native square criteria and fixed-fiber certificates
        run: python -B scripts/verify_v53.py --report /tmp/v53-verification.json
      - name: Verify the detector-field norm scalar and unchanged records
        run: python -B scripts/verify_v52.py --report /tmp/v52-verification.json
      - name: Verify fixed trace obstructions and unchanged construction records
        run: python -B scripts/verify_v51.py --report /tmp/v51-verification.json
      - name: Verify adaptive norm levels and the separate affine scalar obstruction
        run: python -B scripts/verify_v50.py --report /tmp/v50-verification.json
      - name: Verify the complete 71 variable abc quartic and all paired-point strata
        run: python -B scripts/verify_v49.py --report /tmp/v49-verification.json
      - name: Verify small-coefficient abc quartic, inverse references, norm levels, and completion obstructions
        run: python -B scripts/verify_v48.py --report /tmp/v48-verification.json
      - name: Verify norm scalars, actual prescribed traces, reference covers, and signed-class obstructions
        run: python -B scripts/verify_v47.py --report /tmp/v47-verification.json
      - name: Verify the 74 variable abc quartic and finite complement classes
        run: python -B scripts/verify_v46.py --report /tmp/v46-verification.json
      - name: Verify the 195 and 257 variable quartics, complement guards, and mixed-power heights
        run: python -B scripts/verify_v45.py --report /tmp/v45-verification.json
      - name: Verify the 76 variable abc quartic, rational pole surfaces, and obstructions
        run: python -B scripts/verify_v44.py --report /tmp/v44-verification.json
      - name: Verify scalar complements, reference rescaling, norm maps, and obstructions
        run: python -B scripts/verify_v43.py --report /tmp/v43-verification.json
      - name: Verify fixed-fiber guards, K3 surfaces, sections, and reference signs
        run: python -B scripts/verify_v42.py --report /tmp/v42-verification.json
      - name: Verify shared-parameter local solubility and pole obstructions
        run: python -B scripts/verify_v41.py --report /tmp/v41-verification.json
      - name: Verify finite-algebra, chart, label, and coefficient dependencies
        run: python -B scripts/verify_v40.py --report /tmp/v40-verification.json
      - name: Verify exact 196 and 258 variable reductions and supplied 198 archive
        run: python -B scripts/verify_v38.py --report /tmp/v38-verification.json
      - name: Verify the 78 variable abc construction
        run: python -B scripts/verify_v34.py --report /tmp/v34-verification.json
      - name: Verify corrected 200-variable quartic and local obstructions
        run: python -B scripts/verify_v33.py --report /tmp/v33-verification.json
      - name: Verify v30 subalgebra norms and common twists
        run: python -B scripts/verify_v30.py --report /tmp/v30-verification.json
      - name: Verify v29 pole transfers and source restrictions
        run: python -B computation/pole_parameters/joint_realization_v29/check.py
      - name: Verify v28 general degree specifications
        run: python -B scripts/verify_v28.py --report /tmp/v28-verification.json
      - name: Verify cumulative v23-v27 constructions
        run: python -B scripts/verify_release_v27.py --report /tmp/v27-verification.json
      - name: Verify byte-pinned legacy constructions
        run: python -B scripts/verify.py --full --receipt /tmp/legacy-verification.json
